*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;

button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--burgundy);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header.mast{position:relative;overflow:hidden;background:var(--burgundy);color:var(--burgundy-ink);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:46px max(16px,env(safe-area-inset-left,0px)) 22px}
.mast-in{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 32px;align-items:flex-end;justify-content:space-between}
.stats{display:flex;gap:20px;font-variant-numeric:tabular-nums}.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1}.stat span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.mast h1{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,6vw,52px);line-height:1;margin:0;letter-spacing:-.02em}
.mast p{margin:8px 0 0;opacity:.88}
.lights{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;padding:0 8px;z-index:1;pointer-events:none}
.lights::before{content:"";position:absolute;left:-10px;right:-10px;top:-14px;height:26px;border-bottom:2px solid rgba(255,255,255,.45);border-radius:50%}
.bulb{position:relative;top:8px;width:10px;height:15px;border-radius:50% 50% 55% 55%;background:var(--c);box-shadow:0 0 10px 2px var(--c)}
.bulb:nth-child(odd){top:12px}
.snow{position:absolute;inset:0;z-index:0;pointer-events:none}
.flake{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.75}
@keyframes fall{to{transform:translateY(260px) translateX(var(--dx))}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:no-preference){.flake{animation:fall var(--d) linear var(--delay) infinite}.bulb{animation:twinkle 2.4s ease-in-out var(--t) infinite}}
@media (prefers-reduced-motion:reduce){.flake{top:var(--y)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h2{font-family:var(--font-display);font-size:17px;margin:0 0 8px}
.day{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day input{border:1px solid transparent;background:var(--burgundy-soft);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
.day input:disabled{opacity:1}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{border-color:var(--burgundy)}
nav.tabs button[aria-selected=true]{background:var(--burgundy);color:var(--burgundy-ink);border-color:var(--burgundy);font-weight:700}
nav.tabs button.plus{border-style:dashed;color:var(--burgundy)}
nav.tabs button.plus[aria-selected=true]{color:var(--burgundy-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card::before{content:"";display:block;height:5px;background:repeating-linear-gradient(135deg,var(--burgundy) 0 10px,var(--surface) 10px 20px)}
#panel.grid{column-width:320px;column-gap:16px}
#panel.grid .card{break-inside:avoid;margin-bottom:16px;display:inline-block;width:100%}
#panel.one{max-width:640px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 16px;background:var(--burgundy-soft);border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--burgundy)}
.card-h small{color:var(--muted)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.body{min-width:0;display:flex;flex-direction:column;gap:2px}
.txt{overflow-wrap:anywhere}
.note{font-size:12px;background:var(--burgundy-soft);color:var(--burgundy);border-radius:4px;padding:1px 7px;align-self:flex-start;overflow-wrap:anywhere}
a.lnk{font-size:13px;color:var(--burgundy);font-weight:500;align-self:flex-start;text-underline-offset:2px}
.acts{display:flex;gap:2px;flex:none}
.ib{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:4px 8px;font-size:13px}
.ib:hover{background:var(--burgundy-soft);color:var(--burgundy)}
.ib.sure{background:var(--danger);color:#fff}
.add{padding:12px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.in{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .in{flex:1 1 150px}

.empty{padding:16px;color:var(--muted)}
.msg{background:var(--burgundy-soft);color:var(--burgundy);border-radius:8px;padding:8px 14px;font-size:14px}
.msg.err{background:var(--danger);color:#fff}

      var data={owner:own,item:txt,notes:n.value.trim(),link:safeUrl(l.value)};
      items.push(norm(Object.assign({id:'tmp'+Date.now()},data)));sel=own;render();
      post({action:'add',item:data}).then(after).catch(after)});
    return f}
  function cardFor(owner){
    var mine=items.filter(function(i){return key(i.owner)===key(owner)});
    var ul=el('div');
    if(!mine.length)ul.appendChild(el('div',{class:'empty',text:'No wishes yet.'}));
    mine.forEach(function(i){
      var body=el('div',{class:'body'},[el('span',{class:'txt',text:i.name})]);
      if(i.note)body.appendChild(el('span',{class:'note',text:i.note}));
      var sl=safeUrl(i.link);if(sl)body.appendChild(el('a',{class:'lnk',href:sl,target:'_blank',rel:'noopener noreferrer',text:'Open link · '+host(sl)}));
      var acts=el('div',{class:'acts'});
      if(live){
        var eb=el('button',{class:'ib',type:'button',text:'Edit','aria-label':'Edit '+i.name});eb.addEventListener('click',function(){openEdit(i)});
        var db=el('button',{class:'ib',type:'button',text:'Delete','aria-label':'Delete '+i.name});
        db.addEventListener('click',function(){
          if(!db.classList.contains('sure')){db.classList.add('sure');db.textContent='Sure?';setTimeout(function(){db.classList.remove('sure');db.textContent='Delete'},3000);return}
          items=items.filter(function(x){return x.id!==i.id});render();post({action:'delete',id:i.id}).then(after).catch(after)});
        acts.appendChild(eb);acts.appendChild(db)}
      ul.appendChild(el('div',{class:'item'},[body,acts]))});
    var nm=mine.length?mine[0].owner:owner;
    var card=el('div',{class:'card'},[el('div',{class:'card-h'},[el('h2',{text:nm}),el('small',{text:mine.length+(mine.length===1?' wish':' wishes')})]),ul]);
    if(live)card.appendChild(addForm(nm));
    return card}
  function renderPanel(){
    var p=$('panel');p.innerHTML='';
    if(sel===NEW){p.className='one';p.appendChild(el('div',{class:'card'},[el('div',{class:'card-h'},[el('h2',{text:'Add your name'})]),addForm(null)]));return}
    if(sel===ALL){p.className='grid';owners().forEach(function(o){p.appendChild(cardFor(o))});return}
    p.className='one';p.appendChild(cardFor(sel))}
  function render(){renderTabs();renderPanel();fillEvent();var st=$('stats');st.innerHTML='';[[owners().length,'people'],[items.length,'wishes']].forEach(function(x){st.appendChild(el('div',{class:'stat'},[el('b',{text:String(x[0])}),el('span',{text:x[1]})]))})}

  // ----- edit dialog
  var dlg=$('dlg');
  function openEdit(i){editing=i;$('e-name').value=i.name;$('e-note').value=i.note;$('e-link').value=i.link;dlg.showModal();setTimeout(function(){$('e-name').focus()},30)}
  $('e-cancel').addEventListener('click',function(){dlg.close()});
  $('form').addEventListener('submit',function(e){e.preventDefault();var t=editing,name=$('e-name').value.trim();if(!name)return;
    t.name=name;t.note=$('e-note').value.trim();t.link=safeUrl($('e-link').value);dlg.close();render();
    post({action:'update',id:t.id,fields:{item:t.name,notes:t.note,link:t.link}}).then(after).catch(after)});

  // ----- The Day
  function buildEvent(){var box=$('event');box.innerHTML='';
    EVENT_FIELDS.forEach(function(x){var inp=el('input',{id:'ev-'+x[0],type:'text',maxlength:'120',autocomplete:'off'});inp.disabled=!live;
      inp.addEventListener('change',function(){event[x[0]]=inp.value.trim();post({action:'day',key:x[0],value:inp.value.trim()}).catch(function(){})});
      box.appendChild(el('div',{class:'field'},[el('label',{for:'ev-'+x[0],text:x[1]}),inp]))})}
  function fillEvent(){EVENT_FIELDS.forEach(function(x){var i=$('ev-'+x[0]);if(i&&document.activeElement!==i)i.value=event[x[0]]||''})}

  // ----- decor
  (function(){var colors=['#ffd36b','#7fd6a0','#ff9bb3','#fff1d6','#8fc7ff'],L=$('lights'),S=$('snow');
    for(var i=0;i<28;i++){var b=el('span',{class:'bulb'});b.style.setProperty('--c',colors[i%5]);b.style.setProperty('--t',(i%7)*0.35+'s');L.appendChild(b)}
    [[52,30,'#c0243c'],[63,46,'#e3b650'],[73,34,'#2f8a5f'],[82,50,'#d9d9e3'],[92,32,'#c0243c']].forEach(function(o,n){
      var h=el('span',{class:'orn'+(n%2?' hide-s':'')});h.style.left=o[0]+'%';h.style.height=o[1]+'px';h.style.setProperty('--c',o[2]);h.style.setProperty('--t',(n*0.6)+'s');h.appendChild(el('i'));$('lights').parentNode.appendChild(h)});
    for(var j=0;j<44;j++){var f=el('span',{class:'flake'}),s=2+Math.random()*5;f.style.cssText='left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px';
      f.style.setProperty('--d',(5+Math.random()*7)+'s');f.style.setProperty('--delay','-'+(Math.random()*10)+'s');f.style.setProperty('--dx',(Math.random()*40-20)+'px');f.style.setProperty('--y',(Math.random()*90)+'%');S.appendChild(f)}})();

  // ----- start
  buildEvent();items=SEED.map(norm);event=SEED_DAY;render();
  if(!live)say('Viewing a saved copy of the list. Editing turns on once the site is connected.');
  else{say('Loading the latest list…');load().catch(function(){say('Could not reach the shared list. Showing a saved copy; try refreshing.',true)});
    setInterval(function(){if(!dlg.open&&!busy&&!document.hidden&&!document.activeElement.closest('form'))load().catch(function(){})},30000)}
})();
</script></body></html>
